; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default environment(s) to build when no -e flag is specified
; Options: lilygo-t-display-s3 (with display), esp32dev (headless)
default_envs = lilygo-t-display-s3
;default_envs = esp32dev

; ==============================================
; COMMON BUILD FLAGS (shared by both environments)
; ==============================================
[common]
; VERSION FORMAT: v<BITCOIN_BLOCK_HEIGHT>[-suffix]
; Get current block height from: https://mempool.space/api/blocks/tip/height
; Example: Block height 926801 -> VERSION="v926801"
build_flags_common = 
	-DVERSION=\"v938908x\"
	; PRODUCT_TIMEOUT: Time in milliseconds before returning to product selection screen
	; Default: 20000 (20 seconds) for testing, use 60000 (60 seconds) for production
	; Used when: QR/Product shown → timeout → back to Ticker/ProductSelection
	-DPRODUCT_TIMEOUT=30000
	; BTCTICKER_TIMEOUT: Time in milliseconds for ticker display before returning to QR
	; Default: 20000 (20 seconds)
	; Used when: Ticker shown → timeout → back to QR (only in 'selecting' mode)
	-DBTCTICKER_TIMEOUT=10000
	; LOG_ENABLE: 1=on, 0=off (disables all LOG_* macros, saves memory)
	; LOG_LEVEL options: Log::ERROR (least), Log::WARN, Log::INFO (recommended), Log::DEBUG (most verbose)
	-DLOG_ENABLE=1
	-DLOG_LEVEL=Log::INFO
	-DCORE_DEBUG_LEVEL=3

lib_deps_common = 
	bblanchon/ArduinoJson@^7.2.1
	mathertel/OneButton@^2.6.1
	links2004/WebSockets@^2.6.1
	https://github.com/ricmoo/QRCode

; ==============================================
; ENVIRONMENT: LilyGo T-Display-S3 (with Display)
; ==============================================
[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
monitor_filters = esp32_exception_decoder
; Exclude stub implementations for T-Display-S3 (uses real Display.cpp)
build_src_filter = +<*> -<DisplayStubs.cpp>
build_flags = 
	${common.build_flags_common}
	; Enable display support for T-Display-S3
	-DENABLE_DISPLAY=1
	; Enable Bitcoin data fetching for T-Display-S3 (display available)
	-DENABLE_BITCOIN_DATA=1
	; ─────────────────────────────────────────────────────────────
	; NFC Bolt Card reader (PN532 + NTAG424 DNA / Bolt Card support)
	; Set to 1 to activate. Requires hardware: PN532 on I2C (GPIO17/18)
	; and NFC IRQ line on GPIO 1. Server-side: bitcoinswitch_extension
	; must handle the "lnurlw" WebSocket event (see Network.cpp).
	; 0 = disabled (default, zero impact on normal operation)
	; 1 = enabled
	-DENABLE_NFC=0
  -DENABLE_NFC_TEST=0
	; ─────────────────────────────────────────────────────────────
	; TFT_eSPI display configuration
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_BL=38
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_PARALLEL_8_BIT=1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
lib_deps = 
	${common.lib_deps_common}
	bodmer/TFT_eSPI@^2.5.43
	; NFC Bolt Card support (PN532 + NTAG424 DNA - same lib as PartyTapDeviceV2)
	; Included always, only compiled in when ENABLE_NFC=1 is set
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	; Required dependency of Adafruit-PN532-NTAG424
	arduino-libraries/Arduino_CRC32@^1.0.0

; ==============================================
; ENVIRONMENT: ESP32 Dev Module (Headless - no Display)
; ==============================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
board_build.flash_size = 4MB
monitor_filters = esp32_exception_decoder
; Exclude Display.cpp for ESP32 Dev, use DisplayStubs.cpp instead
build_src_filter = +<*> -<Display.cpp> +<DisplayStubs.cpp>
build_flags = 
	${common.build_flags_common}
	; Disable display support for ESP32 Dev Module
	-DENABLE_DISPLAY=0
	; Disable Bitcoin data fetching for headless version (no display to show it)
	-DENABLE_BITCOIN_DATA=0
	; ─────────────────────────────────────────────────────────────
	; NFC Bolt Card reader (PN532 + NTAG424 DNA / Bolt Card support)
	; IRQ line on GPIO 4 (GPIO 1 = UART0 TX on classic ESP32 → not usable)
	-DENABLE_NFC=1
	-DENABLE_NFC_TEST=0
	; ─────────────────────────────────────────────────────────────
	; MULTI-CHANNEL RELAY CONTROL (Headless / esp32dev)
	;
	; Standardmäßig aktiv – keine Build-Flag nötig.
	; Das Gerät schaltet den GPIO, den LNbits im "paid"-Event zurückgibt.
	; Auf dem LNbits-Server (zapbox_extension / bitcoinswitch_extension)
	; wird je Schalter der gewünschte GPIO hinterlegt.
	;
	; Verfügbare Relay-Kanäle (GPIO → Kanal):
	;   CH01 → GPIO 12   (Standard / Single-Mode)
	;   CH02 → GPIO 13
	;   CH03 → GPIO 14  (NOT GPIO 10: internal flash on ESP32-WROOM-32!)
	;   CH04 → GPIO 16  (NOT GPIO 11: internal flash on ESP32-WROOM-32!)
	;   CH05 → GPIO 19   ─┐
	;   CH06 → GPIO 22    │
	;   CH07 → GPIO 23    │ nur Headless (esp32dev)
	;   CH08 → GPIO 25    │
	;   CH09 → GPIO 26    │
	;   CH10 → GPIO 27    │
	;   CH11 → GPIO 32    │
	;   CH12 → GPIO 33   ─┘
	;
	; Belegte GPIOs (nicht als Relay nutzbar):
	;   GPIO  0 – BOOT-Button
	;   GPIO  1 – UART0 TX  (reserviert)
	;   GPIO  2 – Onboard-LED
	;   GPIO  3 – UART0 RX  (reserviert)
	;   GPIO  4 – NFC IRQ (PN532)
	;   GPIO  6-11 – interner SPI-Flash (⚠ NICHT als Output nutzbar!)
	;   GPIO 17 – I2C SCL (NFC)
	;   GPIO 18 – I2C SDA (NFC)
	;   GPIO 21 – LED-Ausgang
	;
	; Verbleibende freie GPIOs: 5, 15
	; ─────────────────────────────────────────────────────────────
	; Memory optimizations for 4MB flash
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL_INFO=1
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
lib_deps = 
	${common.lib_deps_common}
	; NFC Bolt Card support (PN532 + NTAG424 DNA)
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	; Required dependency of Adafruit-PN532-NTAG424
	arduino-libraries/Arduino_CRC32@^1.0.0


