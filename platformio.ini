; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = jc3248w535c
default_envs = lilygo-t-display-s3
;default_envs = esp32dev
;default_envs = esp32dev_nt3h_test
;default_envs = esp32-c3-21-1

[common]
build_flags_common = 
	-DVERSION=\"v949844x\"
	-DPRODUCT_TIMEOUT=30000
	-DBTCTICKER_TIMEOUT=10000
	-DLOG_ENABLE=1
	-DLOG_LEVEL=Log::INFO
	-DCORE_DEBUG_LEVEL=3
lib_deps_common = 
	bblanchon/ArduinoJson@^7.2.1
	mathertel/OneButton@^2.6.1
	links2004/WebSockets@^2.6.1
	https://github.com/ricmoo/QRCode
	robtillaart/PCF8574@^0.4.4

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<DisplayStubs.cpp> -<nt3h_test.cpp>
build_flags = 
	${common.build_flags_common}
	-DENABLE_DISPLAY=1
	-DENABLE_BITCOIN_DATA=1
	-DENABLE_NFC=1
	-DENABLE_NFC_TEST=0
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_MOSI=-1
	-DTFT_PARALLEL_8_BIT=1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_BL=38
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_WR=8
	-DTFT_RD=9
lib_deps = 
	${common.lib_deps_common}
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	arduino-libraries/Arduino_CRC32@^1.0.0
	madhephaestus/ESP32Servo@^3.0.6
	moononournation/GFX Library for Arduino@1.4.7

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
board_build.flash_size = 4MB
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<Display.cpp> +<DisplayStubs.cpp> -<nt3h_test.cpp>
build_flags = 
	${common.build_flags_common}
	-DENABLE_DISPLAY=0
	-DENABLE_BITCOIN_DATA=0
	-DENABLE_NFC=1
	-DENABLE_NFC_TEST=0
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL_INFO=1
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
lib_deps = 
	${common.lib_deps_common}
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	arduino-libraries/Arduino_CRC32@^1.0.0
	madhephaestus/ESP32Servo@^3.0.6
	moononournation/GFX Library for Arduino@1.4.7

[env:esp32dev_nt3h_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
board_build.flash_size = 4MB
monitor_filters = esp32_exception_decoder
; ---- NT3H2111 test only: compile nt3h_test.cpp in isolation ----
build_src_filter = -<*> +<nt3h_test.cpp>
build_flags =
	-DCORE_DEBUG_LEVEL=3
lib_deps =

[env:esp32-c3-21-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
board_build.flash_size = 4MB
monitor_filters = esp32_exception_decoder
upload_protocol = esptool
; Native USB CDC on ESP32-C3 (GPIO18=D-, GPIO19=D+) — no external UART chip.
; If auto-reset does not work, hold IO9 (BOOT) LOW while pressing EN, then release IO9.
build_src_filter = +<*> -<Display.cpp> -<DisplayTouch.cpp> -<TouchAXS15231B.cpp> -<esp_lcd_axs15231b.c> -<test_c3_relay.cpp> -<nt3h_test.cpp>
build_flags =
	${common.build_flags_common}
	-DBOARD_ESP32C3_21_1=1
	-DENABLE_DISPLAY=0
	-DENABLE_BITCOIN_DATA=0
	-DENABLE_NFC=1
	-DENABLE_NFC_TEST=0
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL_INFO=1
	-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${common.lib_deps_common}
	arduino-libraries/Arduino_CRC32@^1.0.0
	madhephaestus/ESP32Servo@^3.0.6
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git

[env:jc3248w535c]
platform = espressif32
; ESP32-S3-WROOM-1 N16R8: 16MB QIO flash + 8MB OPI PSRAM — matches JC3248W535C hardware
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
; board_build.flash_size = 16MB is now inherited from board definition
; board_build.arduino.memory_type = qio_opi is now inherited from board definition
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<Display.cpp> -<DisplayStubs.cpp> -<esp_lcd_axs15231b.c> -<TouchCST816S.cpp> -<nt3h_test.cpp>
build_flags =
	${common.build_flags_common}
	-DBOARD_JC3248W535C=1
	-DLCD_QSPI_CS=45
	-DLCD_QSPI_CLK=47
	-DLCD_QSPI_D0=21
	-DLCD_QSPI_D1=48
	-DLCD_QSPI_D2=40
	-DLCD_QSPI_D3=39
	-DLCD_BL_PIN=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DENABLE_DISPLAY=1
	-DENABLE_BITCOIN_DATA=1
	-DENABLE_NFC=1
	-DENABLE_NFC_TEST=0
lib_deps =
	${common.lib_deps_common}
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	arduino-libraries/Arduino_CRC32@^1.0.0
	madhephaestus/ESP32Servo@^3.0.6
	moononournation/GFX Library for Arduino@1.4.7
