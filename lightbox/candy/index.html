<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="../favicon.webp" />
  <title>Galerie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
      padding: 40px 20px 60px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 1.05rem;
      color: #aaa;
      line-height: 1.7;
    }

    /* ── Header link ── */
    header a {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      background: #ff6b35;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
    }
    header a:hover {
      background: #ff8555;
      transform: translateY(-1px);
    }

    /* ── Footer section ── */
    .footer-section {
      max-width: 900px;
      margin: 60px auto 0;
      padding-top: 40px;
      border-top: 1px solid #333;
      text-align: center;
      font-size: 1rem;
      color: #999;
      line-height: 1.6;
    }

    .footer-section a {
      color: #ff6b35;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer-section a:hover {
      color: #ff8555;
      text-decoration: underline;
    }

    /* ── Gallery grid ── */
    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      cursor: pointer;
      background: #222;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease, opacity 0.2s;
      opacity: 0.9;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      opacity: 1;
    }

    /* ── Lightbox overlay ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox-img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 6px;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      user-select: none;
    }

    /* close button */
    #lb-close {
      position: fixed;
      top: 18px;
      right: 22px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s;
      z-index: 1010;
    }
    #lb-close:hover { opacity: 1; }

    /* prev / next arrows */
    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 2.2rem;
      line-height: 1;
      padding: 14px 18px;
      cursor: pointer;
      border-radius: 4px;
      opacity: 0.7;
      transition: opacity 0.15s, background 0.15s;
      z-index: 1010;
      user-select: none;
    }
    .lb-arrow:hover { opacity: 1; background: rgba(255,255,255,0.2); }
    #lb-prev { left: 16px; }
    #lb-next { right: 16px; }

    /* counter */
    #lb-counter {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 0.9rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Candy Dispenser</h1>
    <p>
      A candy machine that accepts Lightning payments.<br>
    </p>
    <a href="https://www.amazon.de/dp/B01N37YNXW" target="_blank">Amazon</a> <a href="https://www.google.com/search?q=candy+dispenser+amazon" target="_blank">🍬 Search for candy dispenser</a>
  </header>

  <div class="gallery" id="gallery"></div>

  <div class="footer-section">
    <a href="https://zapbox.space/" target="_blank">ZapBox</a> revolutionizes how Lightning payments are integrated into physical devices.
  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox">
    <button id="lb-close" title="Schließen">&#x2715;</button>
    <button id="lb-prev"  class="lb-arrow" title="Vorheriges">&#8249;</button>
    <img id="lightbox-img" src="" alt="" />
    <button id="lb-next"  class="lb-arrow" title="Nächstes">&#8250;</button>
    <div id="lb-counter"></div>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────
    const IMG_DIR   = 'pics/';   // folder with images
    const IMG_EXT   = '.webp';   // file extension
    const MAX_PROBE = 99;        // maximum images to look for
    // ────────────────────────────────────────────────────────

    const gallery  = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lightbox-img');
    const lbClose  = document.getElementById('lb-close');
    const lbPrev   = document.getElementById('lb-prev');
    const lbNext   = document.getElementById('lb-next');
    const lbCounter= document.getElementById('lb-counter');

    const sources = [];  // collected image paths
    let current   = 0;

    // Pad index to two digits: 1 → "01", 12 → "12"
    function pad(n) { return String(n).padStart(2, '0'); }

    // Try to load images one by one. When one fails → gallery is complete.
    function probeNext(index) {
      if (index > MAX_PROBE) { finalize(); return; }

      const src = IMG_DIR + pad(index) + IMG_EXT;
      const tester = new Image();

      tester.onload = () => {
        sources.push(src);
        addThumb(src, sources.length - 1);
        probeNext(index + 1);
      };

      tester.onerror = () => {
        // Gap tolerance: if the very first image is missing, keep trying up to 3 more
        // Otherwise treat as end of sequence
        if (index === 1) {
          probeNext(index + 1); // allow non-sequential start
        } else {
          finalize();
        }
      };

      tester.src = src;
    }

    function addThumb(src, idx) {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.src     = src;
      img.alt     = 'Bild ' + (idx + 1);
      img.loading = 'lazy';

      item.appendChild(img);
      item.addEventListener('click', () => openLightbox(idx));
      gallery.appendChild(item);
    }

    function finalize() {
      // Nothing extra needed – gallery built incrementally
    }

    // ── Lightbox ─────────────────────────────────────────────
    function openLightbox(index) {
      current = index;
      lbImg.src = sources[current];
      lbImg.alt = 'Bild ' + (current + 1);
      lbCounter.textContent = (current + 1) + ' / ' + sources.length;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    function showPrev() { openLightbox((current - 1 + sources.length) % sources.length); }
    function showNext() { openLightbox((current + 1) % sources.length); }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', showPrev);
    lbNext.addEventListener('click', showNext);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowLeft')  showPrev();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'Escape')     closeLightbox();
    });

    // ── Start ─────────────────────────────────────────────────
    probeNext(1);
  </script>

</body>
</html>
